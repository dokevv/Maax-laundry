<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maxx Laundry</title>
<meta name="theme-color" content="#0B0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maxx Laundry">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<script type="module" src="backend.js"></script>
<style>
  :root {
    --pink: #FF4FA3; --pink-soft: rgba(255,79,163,.16);
    --bg: #0B0B0D; --s1: #17171B; --s2: #222228; --border: #2E2E36;
    --text: #FFFFFF; --muted: #A9A9B4;
    --ok: #4ADE80; --warn: #FBBF24; --bad: #F87171; --info: #60A5FA; --violet: #C4B5FD;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; }

  header { position: sticky; top: 0; z-index: 20; background: rgba(11,11,13,.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px 8px; max-width: 1200px; margin: 0 auto; }
  .logo { color: var(--pink); font-weight: 900; letter-spacing: 3px; font-size: 22px; line-height: 1; }
  .logo small { display: block; font-size: 9px; letter-spacing: 2.5px; font-weight: 700; margin-top: 4px; opacity: .85; }
  .bar .spacer { flex: 1; }
  nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 10px; max-width: 1200px; margin: 0 auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; border: 1px solid var(--border); background: var(--s1); border-radius: 999px; padding: 9px 16px; font-size: 14px; font-weight: 600; color: var(--muted); }
  nav button.active { background: var(--pink); border-color: var(--pink); color: #fff; }
  nav button .n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: rgba(255,255,255,.18); font-size: 12px; }

  main { max-width: 1200px; margin: 0 auto; padding: 16px 16px 90px; }
  h2 { font-size: 22px; margin: 4px 0; }
  h3 { font-size: 16px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .wrap { flex-wrap: wrap; }
  .spacer { flex: 1; }
  .card { background: var(--s1); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
  .grid { display: grid; gap: 12px; }
  .g-stats { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .g-2 { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .stat span { color: var(--muted); font-size: 13px; display: block; }
  .stat b { display: block; font-size: 28px; font-weight: 900; margin-top: 4px; }
  .stat em { font-style: normal; color: var(--muted); font-size: 12px; }
  .money b { font-size: 22px; }

  .btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 700; background: var(--pink); color: #fff; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn.outline { background: transparent; border: 1px solid var(--pink); color: var(--pink); }
  .btn.danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
  .btn.ok { background: var(--ok); color: #062b12; }
  .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .btn.lg { padding: 16px; font-size: 17px; border-radius: 14px; width: 100%; }
  .btn:disabled { opacity: .4; cursor: default; }
  .fab { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 30;
    border: 0; border-radius: 18px; padding: 16px 20px; font-size: 16px; font-weight: 800; background: var(--pink); color: #fff; box-shadow: 0 8px 30px rgba(255,79,163,.35); }

  .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--border); background: var(--s2); border-radius: 999px; padding: 7px 14px; font-size: 13px; }
  .chip.on { background: var(--pink-soft); border-color: var(--pink); color: var(--pink); font-weight: 700; }

  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .st-masuk { background: rgba(169,169,180,.16); color: #D4D4DC; }
  .st-proses { background: rgba(96,165,250,.16); color: var(--info); }
  .st-siap { background: rgba(255,79,163,.16); color: var(--pink); }
  .st-batal { background: rgba(248,113,113,.14); color: var(--bad); text-decoration: line-through; }
  .st-diambil { background: rgba(74,222,128,.15); color: var(--ok); }
  .pay-lunas { background: rgba(74,222,128,.15); color: var(--ok); }
  .pay-dp { background: rgba(251,191,36,.15); color: var(--warn); }
  .pay-belum { background: rgba(248,113,113,.14); color: var(--bad); }
  .late { color: var(--bad); }

  .order { display: block; width: 100%; text-align: left; background: var(--s1); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
  .order .top { display: flex; align-items: center; gap: 8px; }
  .order .no { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .order .name { font-weight: 800; font-size: 16px; margin-top: 6px; }
  .order .items { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .order .bottom { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .order .total { font-weight: 800; }

  .list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
  .list-row:first-child { border-top: 0; }
  .list-row .info { flex: 1; min-width: 0; }
  .list-row .info b { display: block; }
  .list-row .info span { color: var(--muted); font-size: 12px; }
  .amt-in { color: var(--ok); font-weight: 800; white-space: nowrap; }
  .amt-out { color: var(--bad); font-weight: 800; white-space: nowrap; }
  .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); flex: none; }

  .search { width: 100%; background: var(--s1); border: 1px solid var(--border); color: var(--text); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .in { width: 100%; background: var(--s2); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px; }
  textarea.in { resize: vertical; min-height: 60px; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 80px; border: 1px solid var(--border); background: var(--s2); border-radius: 12px; padding: 11px 8px; font-weight: 600; font-size: 14px; }
  .seg button.on { border-color: var(--pink); background: var(--pink-soft); color: var(--pink); }
  .cat-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-btns button { border: 1px solid var(--border); background: var(--s2); border-radius: 14px; padding: 16px 10px; font-size: 16px; font-weight: 800; }
  .cat-btns button.on { border-color: var(--pink); background: var(--pink-soft); color: var(--pink); }
  .cat-btns button span { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 4px; }
  .svc-panel { margin-top: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255,255,255,.02); }
  .svc { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .svc button { text-align: left; border: 1px solid var(--border); background: var(--s2); border-radius: 12px; padding: 10px; }
  .svc button b { display: block; font-size: 13px; }
  .svc button span { color: var(--pink); font-size: 12px; font-weight: 700; }
  .item-line { display: grid; grid-template-columns: 1fr 90px 110px 34px; gap: 8px; align-items: center; margin-top: 8px; }
  .item-line .nm { font-size: 13px; font-weight: 600; }
  .item-line input { padding: 9px; }
  .x { border: 1px solid var(--border); background: var(--s2); border-radius: 10px; height: 38px; }
  .sum { display: flex; justify-content: space-between; padding: 6px 0; }
  .sum.big { font-size: 20px; font-weight: 900; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 12px; }
  .photo-pick { display: flex; align-items: center; gap: 12px; border: 1px dashed var(--border); border-radius: 12px; padding: 12px; }
  .photo-pick img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; }
  .suggest { background: var(--s2); border: 1px solid var(--border); border-radius: 12px; margin-top: 6px; overflow: hidden; }
  .suggest button { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--border); background: transparent; padding: 10px 12px; }
  .suggest button:first-child { border-top: 0; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .modal { background: var(--s1); border: 1px solid var(--border); border-radius: 22px 22px 0 0; width: 100%; max-width: 620px;
    max-height: 94vh; overflow-y: auto; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width: 720px) { .overlay { align-items: center; } .modal { border-radius: 22px; } }
  .modal h3 { font-size: 20px; margin-bottom: 4px; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .actions .btn { flex: 1; }
  .err { color: var(--bad); font-size: 14px; min-height: 18px; margin-top: 8px; }
  .nota { background: #fff; color: #111; border-radius: 12px; padding: 16px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; white-space: pre-wrap; line-height: 1.5; }
  .pin-dots { display: flex; justify-content: center; gap: 14px; margin: 18px 0; }
  .pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--pink); }
  .pin-dots i.f { background: var(--pink); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pad button { padding: 16px 0; font-size: 22px; font-weight: 700; border-radius: 14px; border: 1px solid var(--border); background: var(--s2); }
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .viewer img { max-width: 100%; max-height: 100%; border-radius: 10px; }

  .banner { background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.4); color: var(--warn); padding: 12px 14px; border-radius: 14px; margin-bottom: 14px; font-size: 14px; }
  .empty { text-align: center; padding: 36px 16px; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--s2);
    border: 1px solid var(--pink); padding: 12px 18px; border-radius: 14px; z-index: 80; font-size: 14px; max-width: 90vw; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; margin-top: 12px; }
  .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bars i { display: block; width: 100%; max-width: 34px; background: var(--pink); border-radius: 6px 6px 2px 2px; min-height: 2px; }
  .bars span { font-size: 10px; color: var(--muted); }
  .login { max-width: 380px; margin: 8vh auto 0; }
  .login .big-logo { text-align: center; color: var(--pink); font-weight: 900; letter-spacing: 6px; font-size: 40px; }
  .login .big-logo small { display: block; font-size: 11px; letter-spacing: 4px; margin-top: 6px; }
  .shift-btn { border: 1px solid var(--border); background: var(--s1); border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; text-align: left; line-height: 1.25; }
  .shift-btn.on { border-color: var(--ok); }
  .shift-btn.off { border-color: var(--warn); color: var(--warn); }
  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: start; }
  .col { background: rgba(255,255,255,.02); border: 1px solid var(--border); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 120px; }
  .col h4 { margin: 4px 4px 2px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .rack { display: inline-block; padding: 2px 8px; border-radius: 8px; background: var(--pink); color: #fff; font-size: 12px; font-weight: 800; }
  .by { color: var(--muted); font-size: 11px; }
  .risk { border-left: 4px solid var(--border); }
  .risk.hi { border-left-color: var(--bad); }
  .risk.md { border-left-color: var(--warn); }
  .risk.ok { border-left-color: var(--ok); }
  .lock { border: 1px dashed var(--border); background: transparent; border-radius: 10px; height: 38px; font-size: 13px; color: var(--muted); }
  .inline-pin { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--s2); border-radius: 12px; padding: 10px; }
  .inline-pin input { flex: 1; min-width: 110px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">MAXX<small>LAUNDRY · LEGAH</small></div>
    <span class="spacer"></span>
    <button class="shift-btn" id="shiftBtn" type="button" style="display:none"></button>
    <div style="text-align:right"><b id="clock" style="font-size:18px;font-variant-numeric:tabular-nums">--:--</b><div class="muted small" id="clockDate"></div></div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"><div class="empty"><b>Memuat data…</b></div></main>
<button class="fab" id="fab" type="button">+ Cucian Masuk</button>
<div id="modalRoot"></div>

<script>
/* =====================================================================
   MAXX LAUNDRY — pencatatan cucian & kas
   Data (database artifact, tersinkron):
     orders/{id}    : { no, customerId, name, phone, items:[{service,unit,qty,price}], total,
                        notes, status: masuk|proses|siap|diambil, createdAt, dueAt,
                        procAt, doneAt, pickedAt, payments:[{amount, method, at, proofId, proofUrl}] }
     customers/{id} : { name, phone, notes, createdAt }
     expenses/{id}  : { date, category, amount, method, note, proofId, proofUrl, createdAt }
     settings/main  : { shopName, address, phone, pin, services:[{id,name,unit,price,hours}], expenseCats:[] }
   ===================================================================== */

const STATUS = {
  masuk:   { label: 'Antri',      next: 'proses',  action: 'Mulai Cuci' },
  proses:  { label: 'Dikerjakan', next: 'siap',    action: 'Selesai, Siap Ambil' },
  siap:    { label: 'Siap Ambil', next: 'diambil', action: 'Diambil Pelanggan' },
  diambil: { label: 'Diambil' },
  batal:   { label: 'Dibatalkan' },
};
const METHODS = ['Tunai', 'QRIS', 'Transfer'];
const DEFAULT_SETTINGS = {
  shopName: 'MAXX LAUNDRY', address: 'Legah Group', phone: '', pin: '1234', paper: '58',
  footer: 'Terima kasih. Simpan struk ini untuk pengambilan cucian.',
  services: [
    { id: 'r3', cat: 'kiloan', name: 'Reguler 3 Hari', unit: 'kg', price: 8000, hours: 72 },
    { id: 'r2', cat: 'kiloan', name: '2 Hari', unit: 'kg', price: 10000, hours: 48 },
    { id: 'k1', cat: 'kiloan', name: 'Kilat 1 Hari', unit: 'kg', price: 12000, hours: 24 },
    { id: 'e6', cat: 'kiloan', name: 'Express 6 Jam', unit: 'kg', price: 20000, hours: 6 },
    { id: 's-kemeja', cat: 'satuan', name: 'Kemeja / Kaos', unit: 'pcs', price: 10000, hours: 48 },
    { id: 's-celana', cat: 'satuan', name: 'Celana Panjang', unit: 'pcs', price: 10000, hours: 48 },
    { id: 's-jas', cat: 'satuan', name: 'Jas / Blazer', unit: 'pcs', price: 32000, hours: 72 },
    { id: 's-gaun', cat: 'satuan', name: 'Gaun / Kebaya', unit: 'pcs', price: 32000, hours: 72 },
    { id: 's-sprei', cat: 'satuan', name: 'Sprei Set', unit: 'set', price: 20000, hours: 48 },
    { id: 's-selimut', cat: 'satuan', name: 'Selimut', unit: 'pcs', price: 25000, hours: 72 },
    { id: 's-bc-kecil', cat: 'satuan', name: 'Bed Cover Kecil/Single', unit: 'pcs', price: 32000, hours: 72 },
    { id: 's-bc-besar', cat: 'satuan', name: 'Bed Cover Besar/King', unit: 'pcs', price: 45000, hours: 72 },
    { id: 's-gorden', cat: 'satuan', name: 'Gorden', unit: 'kg', price: 20000, hours: 72 },
    { id: 's-boneka', cat: 'satuan', name: 'Boneka', unit: 'pcs', price: 25000, hours: 72 },
    { id: 's-tas', cat: 'satuan', name: 'Tas', unit: 'pcs', price: 45000, hours: 72 },
    { id: 's-sepatu', cat: 'satuan', name: 'Sepatu', unit: 'pasang', price: 45000, hours: 72 },
    { id: 's-karpet', cat: 'satuan', name: 'Karpet (per meter persegi)', unit: 'meter', price: 20000, hours: 96 },
  ],
  cashiers: [{ id: 'k1794236008276', name: 'Lily', pin: '' }],
  expenseCats: ['Deterjen & Pewangi', 'Plastik & Packing', 'Listrik', 'Air', 'Gas', 'Gaji', 'Perawatan Mesin', 'Lain-lain'],
  requireScalePhoto: true,
};
const HARI = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
const HARI_P = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];

/* ---------------- Utilitas ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pad2 = (n) => String(n).padStart(2, '0');
const rp = (n) => { const v = Math.round(Number(n) || 0); return (v < 0 ? '−' : '') + 'Rp' + Math.abs(v).toLocaleString('id-ID'); };
const num = (v) => { const x = parseFloat(String(v ?? '').replace(/\./g, '').replace(',', '.')); return isNaN(x) ? 0 : x; };
const qtyNum = (v) => { const x = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(x) ? 0 : x; };
const fmtQty = (q) => String(Math.round(q * 100) / 100).replace('.', ',');
const dkey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const keyOf = (iso) => iso ? dkey(new Date(iso)) : '';
const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const todayKey = () => dkey(new Date());
const hm = (iso) => { const d = new Date(iso); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const tgl = (iso) => { const d = new Date(iso); return `${d.getDate()} ${BLN[d.getMonth()]} ${hm(iso)}`; };
const tglHari = (iso) => { const d = new Date(iso); return `${HARI[d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]} ${hm(iso)}`; };
const keyLong = (k) => { const d = parseKey(k); return `${HARI_P[d.getDay()]}, ${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`; };
const paidOf = (o) => (o.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
const dueOf = (o) => Math.max(0, (Number(o.total) || 0) - paidOf(o));
const payState = (o) => { const p = paidOf(o); return p >= (o.total || 0) && o.total > 0 ? 'lunas' : p > 0 ? 'dp' : 'belum'; };
const PAY_LABEL = { lunas: 'Lunas', dp: 'DP', belum: 'Belum bayar' };
const itemsText = (o) => (o.items || []).map((i) => `${i.service} ${fmtQty(i.qty)} ${i.unit}`).join(', ');
const waPhone = (p) => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '62' + d.slice(1); else if (d.startsWith('8')) d = '62' + d; return d; };
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const proofCache = {}; const proofLoading = {}; let proofRenderT;
function imgSrc(id, url) {
  if (url) return url; if (!id) return '';
  if (proofCache[id]) return proofCache[id];
  if (!proofLoading[id] && S.assets) {
    proofLoading[id] = true;
    S.assets.get(id).then((d) => { proofCache[id] = d || BLANK; clearTimeout(proofRenderT); proofRenderT = setTimeout(() => { render(); refreshOpenPhotos(); }, 80); }).catch(() => {});
  }
  return BLANK;
}
function refreshOpenPhotos() { document.querySelectorAll('#modalRoot [data-proof-id]').forEach((el) => { const v = proofCache[el.dataset.proofId]; if (v) el.dataset.photo = v; }); }

/* ---------------- State ---------------- */
const S = {
  db: null, assets: null, canWrite: true, offline: false, loaded: false, auth: 'wait', email: '', role: '',
  ordersActive: {}, ordersRecent: {}, ordersOld: {}, shifts: {}, shift: null, audit: {}, auditRange: '7d', customers: {}, expenses: {}, settings: { ...DEFAULT_SETTINGS },

/* Kecilkan foto sebelum diunggah (hemat kuota, tidak tersimpan di galeri HP). */
function compressImage(file, maxSide = 1280, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob((b) => b ? resolve(b) : reject(new Error('compress')), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}
async function uploadProof(file) {
  if (!file) return {};
  if (!S.assets) throw { code: 'no_assets' };
  const blob = await compressImage(file);
  const r = await S.assets.upload(blob);
  return { proofId: r.id, proofUrl: r.url };
}

function txList(pays, exps, limit) {
  const rows = [...pays.map((p) => ({ t: p.at, html: `<div class="list-row" data-order="${esc(p.order.id)}" role="button" style="cursor:pointer">
      ${p.proofId || p.proofUrl ? `<img class="thumb" src="${esc(imgSrc(p.proofId, p.proofUrl))}" alt="" data-photo="${esc(imgSrc(p.proofId, p.proofUrl))}">` : ''}
      <div class="info"><b>${esc(p.order.name)}</b><span>${esc(p.order.no)} · ${esc(p.method)} · ${hm(p.at)}${p.by ? ' · ' + esc(p.by) : ''}</span></div><span class="amt-in">+${rp(p.amount)}</span></div>` })),
    ...exps.map((e) => ({ t: e.createdAt, html: `<div class="list-row" data-expense="${esc(e.id)}" role="button" style="cursor:pointer">
      ${e.proofId || e.proofUrl ? `<img class="thumb" src="${esc(imgSrc(e.proofId, e.proofUrl))}" alt="" data-photo="${esc(imgSrc(e.proofId, e.proofUrl))}">` : ''}
      <div class="info"><b>${esc(e.category)}</b><span>${esc(e.note || '')}${e.note ? ' · ' : ''}${esc(e.method)}${e.createdAt ? ' · ' + hm(e.createdAt) : ''}${e.by ? ' · ' + esc(e.by) : ''}</span></div><span class="amt-out">−${rp(e.amount)}</span></div>` }))]
    .sort((a, b) => String(b.t).localeCompare(String(a.t)));
  if (!rows.length) return '<div class="muted small" style="padding:14px 0">Belum ada transaksi.</div>';
  const shown = limit ? rows.slice(0, limit) : rows;
  return shown.map((r) => r.html).join('') + (limit && rows.length > limit ? `<button class="btn sm ghost" style="margin-top:8px;width:100%" data-tab-go="kas">Lihat semua (${rows.length})</button>` : '');
}

    if (S.filter === 'batal') return isVoid(o);

  list.sort((a, b) => S.filter === 'semua' ? String(b.createdAt).localeCompare(String(a.createdAt)) : S.filter === 'diambil' ? String(b.pickedAt).localeCompare(String(a.pickedAt)) : String(a.createdAt).localeCompare(String(b.createdAt)));

      : list.length ? `<div class="grid g-2">${list.map(orderCard).join('')}</div>` : `<div class="card empty"><b>Tidak ada cucian</b>${S.filter === 'aktif' ? 'Ketuk + Cucian Masuk untuk mencatat.' : ''}</div>`}
    ${S.q.trim().length >= 4 ? `<div style="margin-top:14px"><button class="btn sm ghost" data-act="searchOld">🔎 Cari "${esc(S.q.trim())}" di nota lama (lebih dari ${RECENT_DAYS} hari)</button></div>` : ''}

function orderCard(o) {

  const add = (t, f = {}) => L.push({ t: toAscii(t), ...f });
  add(s.shopName || 'MAXX LAUNDRY', { c: 1, b: 1, big: 1 });
  wrapText(s.address || '', W).forEach((x) => x && add(x, { c: 1 }));
  if (s.phone) add('WA ' + s.phone, { c: 1 });
  L.push(hr);
  add(lr('No', o.no, W)); add(lr('Tanggal', dtShort(o.createdAt), W)); add(lr('Pelanggan', o.name, W));
  if (o.createdBy) add(lr('Kasir', o.createdBy, W));

  (o.items || []).forEach((i) => { wrapText(i.service, W).forEach((x) => add(x, { b: 1 }));
    add(lr(` ${fmtQty(i.qty)} ${i.unit} x ${money(i.price)}`, money(i.qty * i.price), W)); });
  L.push(hr);
  add(lr('TOTAL', 'Rp ' + money(o.total), W), { b: 1 });
  (o.payments || []).forEach((p) => add(lr(`Bayar ${p.method}`, money(p.amount), W)));

  const short = Object.values(S.shifts).filter((x) => x.endAt && x.endAt >= since && x.diff < 0).length;
  return ev + short;
}
function serverSkewMin(x) {
  const sv = x._serverAt; const ms = sv && typeof sv.toMillis === 'function' ? sv.toMillis() : null;

    },
    searchOld: async () => {

  }[act.dataset.act] || (() => {}))();

async function init() {
  tick(); setInterval(tick, 15000); render();
  const failT = setTimeout(() => { if (!window.MaxxBackend) { S.offline = true; render(); } }, 15000);
  const be = await waitBackend(); clearTimeout(failT);
  be.onUser((u) => {
    if (!u) { S.auth = 'out'; render(); return; }
    S.email = u.email; S.role = u.role;
    if (u.role === 'none') { S.auth = 'none'; render(); return; }
    S.auth = 'in';
    if (!subscribed) { subscribed = true; startData(be); }
    render();
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
function startData(be) {
  const db = be.db; S.db = db; S.assets = be.assets; S.canWrite = true;
  const timer = setTimeout(() => { if (!S.loaded) { toast('Koneksi lambat, data dimuat dari penyimpanan lokal…'); S.loaded = true; render(); } }, 10000);
  const onErr = (e) => { console.error(e); if (e && e.code === 'invalid_argument') toast('Akun ini tidak punya izin membaca data. Hubungi owner.'); };
  const ready = { a: false, r: false };
  const markReady = () => { if (ready.a && ready.r && !S.loaded) { S.loaded = true; clearTimeout(timer); } render(); };
  db.collection('orders').where('status', 'in', ['masuk', 'proses', 'siap']).onSnapshot((snap) => {
    S.ordersActive = {}; snap.docs.forEach((d) => { S.ordersActive[d.id] = { id: d.id, ...d.data() }; }); ready.a = true; markReady();
  }, onErr);
  const since = new Date(Date.now() - RECENT_DAYS * 86400000).toISOString();
  db.collection('orders').where('createdAt', '>=', since).onSnapshot((snap) => {
    S.ordersRecent = {}; snap.docs.forEach((d) => { S.ordersRecent[d.id] = { id: d.id, ...d.data() }; });
    // Cucian aktif yang sudah tidak aktif lagi akan hilang dari ordersActive lewat langganannya sendiri.
    ready.r = true; markReady();
  }, onErr);
  db.collection('customers').onSnapshot((snap) => { S.customers = {}; snap.docs.forEach((d) => { S.customers[d.id] = { id: d.id, ...d.data() }; }); render(); }, onErr);
  db.collection('expenses').where('date', '>=', dkey(new Date(Date.now() - RECENT_DAYS * 86400000))).onSnapshot((snap) => {
    S.expenses = {}; snap.docs.forEach((d) => { S.expenses[d.id] = { id: d.id, ...d.data() }; }); render();
  }, onErr);
  db.collection('shifts').where('startAt', '>=', new Date(Date.now() - 45 * 86400000).toISOString()).onSnapshot((snap) => {
    S.shifts = {}; snap.docs.forEach((d) => { S.shifts[d.id] = { id: d.id, ...d.data() }; });
    S.shift = Object.values(S.shifts).filter((x) => !x.endAt).sort((a, b) => String(b.startAt).localeCompare(String(a.startAt)))[0] || null;
    render();
  }, onErr);
  if (isOwner()) db.collection('audit').where('at', '>=', new Date(Date.now() - 62 * 86400000).toISOString()).onSnapshot((snap) => {
    S.audit = {}; snap.docs.forEach((d) => { S.audit[d.id] = { id: d.id, ...d.data() }; }); renderNav(); if (S.tab === 'audit') render();
  }, () => {});
  db.doc('settings/main').onSnapshot((snap) => { if (snap.exists) S.settings = { ...DEFAULT_SETTINGS, ...snap.data() }; render(); }, onErr);
}
init();
</script>
</body>
</html>
