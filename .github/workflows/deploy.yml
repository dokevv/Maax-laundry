name: Deploy Maxx Laundry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # 1) Aplikasi web -> GitHub Pages (https://dokevv.github.io/Maax-laundry/)
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan file web
        run: |
          mkdir _site
          cp index.html config.js backend.js manifest.json sw.js favicon.png _site/
          cp -r icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  # 2) Aplikasi Android (APK) dengan cetak Bluetooth langsung
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Siapkan proyek Android
        working-directory: android-app
        run: |
          flutter create . --platforms=android --org id.legah --project-name maxx_laundry
          python3 ../tools/patch_android.py
          rm -rf test
      - name: Build APK
        working-directory: android-app
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../maxx-laundry.apk
      - name: Terbitkan APK (link download tetap)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Maxx Laundry (APK terbaru)
          body: |
            Pasang di tablet Android outlet. Download: https://github.com/${{ github.repository }}/releases/download/apk-latest/maxx-laundry.apk
          files: maxx-laundry.apk
          make_latest: true
